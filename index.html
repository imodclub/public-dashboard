
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สรุปผลการปฏิบัติงาน</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f7f6;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            padding: 20px;
            z-index: 1000;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        .nav-item {
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
            color: #64748b;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #e0e7ff;
            color: #4f46e5;
            font-weight: bold;
        }

        .stat-card {
            border-radius: 15px;
            padding: 25px;
            color: white;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .bg-jobs {
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
        }

        .bg-evals {
            background: linear-gradient(45deg, #6f42c1, #d63384);
        }

        .bg-sat {
            background: linear-gradient(45deg, #198754, #20c997);
        }

        .bg-perf {
            background: linear-gradient(45deg, #fd7e14, #ffc107);
        }

        .stat-val {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 500px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .chart-container {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h5 class="fw-bold mb-4 text-center">เมนูรายงาน</h5>

        <div class="nav-item active" onclick="showPage('stats', this)">
            <i class="fas fa-chart-pie me-2"></i>
            สถิติภาพรวม
        </div>

        <div class="nav-item" onclick="showPage('charts', this)">
            <i class="fas fa-chart-line me-2"></i>
            กราฟแนวโน้ม
        </div>

        <div class="nav-item" onclick="showPage('graphs', this)">
            <i class="fas fa-chart-bar me-2"></i>
            แผนภูมิงาน
        </div>
    </div>

    <div class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

            <h3 id="pageTitle" class="fw-bold">
                <i class="fas fa-chart-pie me-2"></i>
                สถิติภาพรวม
            </h3>

            <div class="d-flex gap-2 align-items-center flex-wrap">

                <span class="text-muted small">
                    เลือกช่วงเวลา:
                </span>

                <input type="date" id="dateStart" class="form-control" title="วันที่เริ่มต้น">

                <span class="text-muted">
                    -
                </span>

                <input type="date" id="dateEnd" class="form-control" title="วันที่สิ้นสุด">

                <button class="btn btn-primary px-4 fw-bold" onclick="applyDateFilter()">

                    <i class="fas fa-sync-alt me-1"></i>
                    ดึงข้อมูล

                </button>

            </div>
        </div>

        <div id="page-stats" class="dashboard-page">

            <div class="row g-4 mb-4">

                <div class="col-md-3">
                    <div class="stat-card bg-jobs">

                        <div class="opacity-75">
                            จำนวนงานซ่อม
                        </div>

                        <div class="stat-val" id="v1">
                            ...
                        </div>

                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card bg-evals">

                        <div class="opacity-75">
                            ผู้ตอบประเมิน
                        </div>

                        <div class="stat-val" id="v2">
                            ...
                        </div>

                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card bg-sat">

                        <div class="opacity-75">
                            คะแนนพึงพอใจ
                        </div>

                        <div class="stat-val" id="v3">
                            ...
                        </div>

                    </div>
                </div>

                <div class="col-md-3">
                    <div class="stat-card bg-perf">

                        <div class="opacity-75">
                            คะแนนปฏิบัติงาน
                        </div>

                        <div class="stat-val" id="v4">
                            ...
                        </div>

                    </div>
                </div>

            </div>

            <div class="card p-4">

                <h5 class="mb-3 fw-bold">
                    <i class="fas fa-comments me-2 text-primary"></i>
                    ข้อเสนอแนะล่าสุด (10 รายการ)
                </h5>

                <ul class="list-group list-group-flush" id="commentList">

                    <li class="list-group-item text-muted text-center py-4">
                        กำลังโหลดข้อเสนอแนะ...
                    </li>

                </ul>

            </div>

        </div>

        <div id="page-charts" class="dashboard-page d-none">

            <div class="card p-4">

                <h5 class="fw-bold mb-4">
                    <i class="fas fa-chart-line me-2 text-primary"></i>
                    แนวโน้มจำนวนงานตามวันที่ปฏิบัติงาน
                </h5>

                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>

            </div>

        </div>

        <div id="page-graphs" class="dashboard-page d-none">

            <div class="card p-4">

                <h5 class="fw-bold mb-4">
                    <i class="fas fa-chart-bar me-2 text-primary"></i>
                    จำนวนงานแยกตามประเภท
                </h5>

                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>

            </div>

        </div>

    </div>

    <script>

        let allJobsData = [];
        let allEvalData = [];

        let lineChartInstance = null;
        let barChartInstance = null;

        const urlWorksRecords =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJfoAA1JNxDO5JMM-Zx6OkRlfVqTlqGjyfuGrMyIXmqPTSTCfGNLsOlO0nyEwY5oJr8JG18UGQT9Tv/pub?gid=0&single=true&output=csv';

        const urlEvaluations =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJfoAA1JNxDO5JMM-Zx6OkRlfVqTlqGjyfuGrMyIXmqPTSTCfGNLsOlO0nyEwY5oJr8JG18UGQT9Tv/pub?gid=162882890&single=true&output=csv';


        function showPage(id, el) {

            document
                .querySelectorAll('.dashboard-page')
                .forEach(page => page.classList.add('d-none'));

            document
                .querySelectorAll('.nav-item')
                .forEach(item => item.classList.remove('active'));

            const target = document.getElementById('page-' + id);

            if (target) {
                target.classList.remove('d-none');
            }

            el.classList.add('active');

            const icons = {
                stats: 'fa-chart-pie',
                charts: 'fa-chart-line',
                graphs: 'fa-chart-bar'
            };

            document.getElementById('pageTitle').innerHTML =
                `<i class="fas ${icons[id]} me-2"></i> ${el.innerText.trim()}`;
        }


        function parseCSVLine(line) {

            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {

                const char = line[i];

                if (char === '"') {

                    if (insideQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }

                } else if (char === ',' && !insideQuotes) {

                    result.push(current.trim());
                    current = '';

                } else {

                    current += char;
                }
            }

            result.push(current.trim());

            return result;
        }


        function parseCSV(text) {

            const rows = [];
            let row = [];
            let cell = '';
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {

                const char = text[i];

                if (char === '"') {

                    if (insideQuotes && text[i + 1] === '"') {
                        cell += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }

                } else if (char === ',' && !insideQuotes) {

                    row.push(cell.trim());
                    cell = '';

                } else if ((char === '\n' || char === '\r') && !insideQuotes) {

                    if (char === '\r' && text[i + 1] === '\n') {
                        i++;
                    }

                    row.push(cell.trim());

                    if (row.some(value => value !== '')) {
                        rows.push(row);
                    }

                    row = [];
                    cell = '';

                } else {

                    cell += char;
                }
            }

            if (cell !== '' || row.length > 0) {

                row.push(cell.trim());

                if (row.some(value => value !== '')) {
                    rows.push(row);
                }
            }

            return rows;
        }


        function parseDateString(value) {

            if (!value) return null;

            let dateStr = String(value)
                .replace(/\u00A0/g, ' ')
                .trim();

            if (!dateStr) return null;

            let match;

            match = dateStr.match(
                /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s*,?\s*(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/
            );

            if (match) {

                let year = parseInt(match[1], 10);
                let month = parseInt(match[2], 10);
                let day = parseInt(match[3], 10);

                let hour = parseInt(match[4] || '0', 10);
                let minute = parseInt(match[5] || '0', 10);
                let second = parseInt(match[6] || '0', 10);

                if (year > 2400) {
                    year -= 543;
                }

                const date = new Date(
                    year,
                    month - 1,
                    day,
                    hour,
                    minute,
                    second
                );

                if (
                    date.getFullYear() === year &&
                    date.getMonth() === month - 1 &&
                    date.getDate() === day
                ) {
                    return date;
                }
            }


            match = dateStr.match(
                /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s*,?\s*(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/
            );

            if (match) {

                let day = parseInt(match[1], 10);
                let month = parseInt(match[2], 10);
                let year = parseInt(match[3], 10);

                let hour = parseInt(match[4] || '0', 10);
                let minute = parseInt(match[5] || '0', 10);
                let second = parseInt(match[6] || '0', 10);

                if (year > 2400) {
                    year -= 543;
                }

                const date = new Date(
                    year,
                    month - 1,
                    day,
                    hour,
                    minute,
                    second
                );

                if (
                    date.getFullYear() === year &&
                    date.getMonth() === month - 1 &&
                    date.getDate() === day
                ) {
                    return date;
                }
            }


            const directDate = new Date(dateStr);

            if (!isNaN(directDate.getTime())) {
                return directDate;
            }

            return null;
        }


        function createStartDate(value) {

            if (!value) return null;

            const [year, month, day] = value
                .split('-')
                .map(Number);

            return new Date(
                year,
                month - 1,
                day,
                0,
                0,
                0,
                0
            );
        }


        function createEndDate(value) {

            if (!value) return null;

            const [year, month, day] = value
                .split('-')
                .map(Number);

            return new Date(
                year,
                month - 1,
                day,
                23,
                59,
                59,
                999
            );
        }


        function isDateInRange(date, startDate, endDate) {

            if (!date || isNaN(date.getTime())) {
                return false;
            }

            const time = date.getTime();

            if (startDate && time < startDate.getTime()) {
                return false;
            }

            if (endDate && time > endDate.getTime()) {
                return false;
            }

            return true;
        }


        async function fetchInitialData() {

            try {

                document.getElementById('v1').innerText = '...';
                document.getElementById('v2').innerText = '...';
                document.getElementById('v3').innerText = '...';
                document.getElementById('v4').innerText = '...';

                const cacheBuster = '?t=' + Date.now();

                const jobsUrl =
                    urlWorksRecords +
                    '&t=' +
                    Date.now();

                const evalUrl =
                    urlEvaluations +
                    '&t=' +
                    Date.now();

                const [
                    jobsResponse,
                    evalResponse
                ] = await Promise.all([
                    fetch(jobsUrl),
                    fetch(evalUrl)
                ]);

                if (!jobsResponse.ok) {
                    throw new Error('ไม่สามารถโหลดข้อมูลงานซ่อมได้');
                }

                if (!evalResponse.ok) {
                    throw new Error('ไม่สามารถโหลดข้อมูลประเมินได้');
                }

                const [
                    jobsText,
                    evalText
                ] = await Promise.all([
                    jobsResponse.text(),
                    evalResponse.text()
                ]);

                allJobsData = parseCSV(jobsText);
                allEvalData = parseCSV(evalText);

                if (allJobsData.length === 0) {
                    throw new Error('ไม่พบข้อมูลงานซ่อม');
                }

                applyDateFilter();

            } catch (error) {

                console.error(error);

                document.getElementById('v1').innerText = '0';
                document.getElementById('v2').innerText = '0';
                document.getElementById('v3').innerText = '0.00';
                document.getElementById('v4').innerText = '0.00';

                document.getElementById('commentList').innerHTML =
                    `<li class="list-group-item text-danger text-center py-4">
                        ไม่สามารถโหลดข้อมูลได้
                    </li>`;

                alert(
                    'ไม่สามารถดึงข้อมูลจาก Google Sheet ได้\n' +
                    error.message
                );
            }
        }


        function applyDateFilter() {

            const startInput =
                document.getElementById('dateStart').value;

            const endInput =
                document.getElementById('dateEnd').value;

            const startDate =
                createStartDate(startInput);

            const endDate =
                createEndDate(endInput);


            if (
                startDate &&
                endDate &&
                startDate.getTime() > endDate.getTime()
            ) {

                alert(
                    'วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด'
                );

                return;
            }


            const filteredJobRows = [];

            for (let i = 1; i < allJobsData.length; i++) {

                const row = allJobsData[i];

                if (!row || row.length === 0) {
                    continue;
                }

                const workDateText =
                    row[7] && row[7].trim()
                        ? row[7]
                        : row[0];

                const workDate =
                    parseDateString(workDateText);

                if (
                    isDateInRange(
                        workDate,
                        startDate,
                        endDate
                    )
                ) {

                    filteredJobRows.push(row);
                }
            }


            updateStatsSummary(
                filteredJobRows,
                startDate,
                endDate
            );


            updateLineChart(
                allJobsData,
                startDate,
                endDate
            );


            updateBarChart(
                filteredJobRows
            );
        }


        function updateStatsSummary(
            filteredRows,
            startDate,
            endDate
        ) {

            const totalJobs =
                filteredRows.length;

            let sumSat = 0;
            let sumPerf = 0;

            let satCount = 0;
            let perfCount = 0;

            let evalCount = 0;

            const comments = [];


            for (
                let i = 1;
                i < allEvalData.length;
                i++
            ) {

                const row =
                    allEvalData[i];

                if (!row || row.length < 5) {
                    continue;
                }

                const rowDate =
                    parseDateString(row[0]);

                if (
                    !isDateInRange(
                        rowDate,
                        startDate,
                        endDate
                    )
                ) {
                    continue;
                }


                const sat =
                    parseFloat(
                        String(row[3] || '')
                            .replace(',', '.')
                    );

                const perf =
                    parseFloat(
                        String(row[4] || '')
                            .replace(',', '.')
                    );


                if (!isNaN(sat)) {

                    sumSat += sat;
                    satCount++;
                }


                if (!isNaN(perf)) {

                    sumPerf += perf;
                    perfCount++;
                }


                if (
                    !isNaN(sat) ||
                    !isNaN(perf)
                ) {

                    evalCount++;
                }


                const comment =
                    row[5]
                        ? String(row[5]).trim()
                        : '';


                if (comment !== '') {

                    comments.push({
                        text: comment,
                        date: rowDate
                            ? rowDate.toLocaleDateString(
                                'th-TH'
                            )
                            : ''
                    });
                }
            }


            comments.sort(
                (a, b) => {

                    const da =
                        parseDateString(a.date);

                    const db =
                        parseDateString(b.date);

                    if (!da || !db) return 0;

                    return db - da;
                }
            );


            document.getElementById('v1').innerText =
                totalJobs.toLocaleString('th-TH');


            document.getElementById('v2').innerText =
                evalCount.toLocaleString('th-TH');


            document.getElementById('v3').innerText =
                satCount > 0
                    ? (sumSat / satCount).toFixed(2)
                    : '0.00';


            document.getElementById('v4').innerText =
                perfCount > 0
                    ? (sumPerf / perfCount).toFixed(2)
                    : '0.00';


            let commentHtml = '';

            if (comments.length === 0) {

                commentHtml =
                    `<li class="list-group-item text-muted text-center py-4">
                        ไม่มีข้อเสนอแนะ
                    </li>`;

            } else {

                comments
                    .slice(0, 10)
                    .forEach(comment => {

                        const safeText =
                            comment.text
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&#039;');

                        commentHtml +=
                            `<li class="list-group-item py-3">
                                <div class="fw-bold text-dark">
                                    "${safeText}"
                                </div>
                                <small class="text-muted">
                                    เมื่อ ${comment.date}
                                </small>
                            </li>`;
                    });
            }


            document.getElementById('commentList').innerHTML =
                commentHtml;
        }


        function updateLineChart(
            allRows,
            startDate,
            endDate
        ) {

            const dailyCounts = {};


            for (
                let i = 1;
                i < allRows.length;
                i++
            ) {

                const row =
                    allRows[i];

                if (!row) continue;


                const dateText =
                    row[7] &&
                        row[7].trim() !== ''
                        ? row[7]
                        : row[0];


                if (!dateText) continue;


                const date =
                    parseDateString(dateText);


                if (!date || isNaN(date.getTime())) {
                    continue;
                }


                if (
                    !isDateInRange(
                        date,
                        startDate,
                        endDate
                    )
                ) {
                    continue;
                }


                const dateOnly =
                    new Date(
                        date.getFullYear(),
                        date.getMonth(),
                        date.getDate()
                    );


                const timeKey =
                    dateOnly.getTime();


                if (!dailyCounts[timeKey]) {
                    dailyCounts[timeKey] = 0;
                }


                dailyCounts[timeKey]++;
            }


            let dates =
                Object.keys(dailyCounts)
                    .map(Number)
                    .sort((a, b) => a - b);


            if (dates.length === 0) {

                if (lineChartInstance) {
                    lineChartInstance.destroy();
                    lineChartInstance = null;
                }

                lineChartInstance =
                    new Chart(
                        document.getElementById('lineChart'),
                        {
                            type: 'line',
                            data: {
                                labels: [],
                                datasets: [{
                                    label: 'จำนวนงานซ่อมตามวันที่ปฏิบัติงาน',
                                    data: []
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false
                            }
                        }
                    );

                return;
            }


            let chartStart;
            let chartEnd;


            if (startDate) {

                chartStart =
                    new Date(startDate);

                chartStart.setHours(
                    0,
                    0,
                    0,
                    0
                );

            } else {

                chartStart =
                    new Date(dates[0]);

            }


            if (endDate) {

                chartEnd =
                    new Date(endDate);

                chartEnd.setHours(
                    23,
                    59,
                    59,
                    999
                );

            } else {

                chartEnd =
                    new Date(
                        dates[dates.length - 1]
                    );

                chartEnd.setHours(
                    23,
                    59,
                    59,
                    999
                );
            }


            const thaiMonths = [
                'ม.ค.',
                'ก.พ.',
                'มี.ค.',
                'เม.ย.',
                'พ.ค.',
                'มิ.ย.',
                'ก.ค.',
                'ส.ค.',
                'ก.ย.',
                'ต.ค.',
                'พ.ย.',
                'ธ.ค.'
            ];


            const labels = [];
            const values = [];


            const currentDate =
                new Date(chartStart);


            currentDate.setHours(
                0,
                0,
                0,
                0
            );


            while (
                currentDate.getTime() <=
                chartEnd.getTime()
            ) {

                const timeKey =
                    new Date(
                        currentDate.getFullYear(),
                        currentDate.getMonth(),
                        currentDate.getDate()
                    ).getTime();


                labels.push(
                    `${currentDate.getDate()} ${thaiMonths[currentDate.getMonth()]} ${currentDate.getFullYear() + 543}`
                );


                values.push(
                    dailyCounts[timeKey] || 0
                );


                currentDate.setDate(
                    currentDate.getDate() + 1
                );
            }


            if (lineChartInstance) {
                lineChartInstance.destroy();
            }


            lineChartInstance =
                new Chart(
                    document.getElementById('lineChart'),
                    {
                        type: 'line',

                        data: {
                            labels: labels,

                            datasets: [{
                                label:
                                    'จำนวนงานซ่อมตามวันที่ปฏิบัติงาน',

                                data: values,

                                borderColor:
                                    '#4f46e5',

                                backgroundColor:
                                    'rgba(79, 70, 229, 0.1)',

                                tension: 0.3,

                                fill: true,

                                pointRadius: 4,

                                pointHoverRadius: 6,

                                pointBackgroundColor:
                                    '#4f46e5',

                                pointBorderColor:
                                    '#ffffff',

                                pointBorderWidth: 2
                            }]
                        },

                        options: {

                            responsive: true,

                            maintainAspectRatio: false,

                            interaction: {
                                intersect: false,
                                mode: 'index'
                            },

                            scales: {

                                x: {
                                    title: {
                                        display: true,
                                        text: 'วันที่ปฏิบัติงาน'
                                    },

                                    ticks: {
                                        maxRotation: 60,
                                        minRotation: 45
                                    }
                                },

                                y: {
                                    beginAtZero: true,

                                    title: {
                                        display: true,
                                        text: 'จำนวนเคส'
                                    },

                                    ticks: {
                                        precision: 0
                                    }
                                }
                            },

                            plugins: {

                                legend: {
                                    display: true
                                },

                                tooltip: {

                                    callbacks: {

                                        title:
                                            items =>
                                                `วันที่: ${items[0].label}`,

                                        label:
                                            context =>
                                                ` จำนวน: ${context.parsed.y} เคส`
                                    }
                                }
                            }
                        }
                    }
                );
        }


        function updateBarChart(
            filteredRows
        ) {

            const categoryCounts = {};


            for (
                let i = 0;
                i < filteredRows.length;
                i++
            ) {

                const row =
                    filteredRows[i];

                if (!row) continue;


                const category =
                    row[4]
                        ? String(row[4]).trim()
                        : '';


                if (!category) continue;


                categoryCounts[category] =
                    (categoryCounts[category] || 0) + 1;
            }


            const categories =
                Object.keys(categoryCounts)
                    .sort(
                        (a, b) =>
                            categoryCounts[b] -
                            categoryCounts[a]
                    );


            const values =
                categories.map(
                    category =>
                        categoryCounts[category]
                );


            if (barChartInstance) {
                barChartInstance.destroy();
            }


            barChartInstance =
                new Chart(
                    document.getElementById('barChart'),
                    {
                        type: 'bar',

                        data: {

                            labels: categories,

                            datasets: [{
                                label:
                                    'จำนวนงานแยกตามประเภท',

                                data: values,

                                backgroundColor: [
                                    '#0d6efd',
                                    '#6f42c1',
                                    '#198754',
                                    '#ffc107',
                                    '#fd7e14',
                                    '#0dcaf0',
                                    '#dc3545',
                                    '#20c997',
                                    '#6610f2',
                                    '#d63384'
                                ]
                            }]
                        },

                        options: {

                            responsive: true,

                            maintainAspectRatio: false,

                            scales: {

                                x: {
                                    ticks: {
                                        autoSkip: false,
                                        maxRotation: 45,
                                        minRotation: 0
                                    }
                                },

                                y: {

                                    beginAtZero: true,

                                    ticks: {
                                        precision: 0
                                    }
                                }
                            },

                            plugins: {

                                legend: {
                                    display: true
                                },

                                tooltip: {

                                    callbacks: {

                                        label:
                                            context =>
                                                ` ${context.parsed.y} งาน`
                                    }
                                }
                            }
                        }
                    }
                );
        }


        window.addEventListener(
            'load',
            fetchInitialData
        );

    </script>

</body>

</html>
